# SD card layout:
#  1. boot  (FAT)  firmware, kernel, config.txt
#  2. root  (ext4) the system, mounted read-only
#  3. KEGS  (FAT)  ROM file, config.kegs and disk images - this is the
#                  partition you edit from your Mac or PC
image boot.vfat {
	vfat {
		label = "BOOT"
		files = {
#BOOT_FILES#
		}
	}
	size = 64M
}

image kegs.vfat {
	vfat {
		label = "KEGS"
		files = {
#KEGS_FILES#
		}
	}
	size = #KEGS_SIZE#
}

image sdcard.img {
	hdimage {
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}

	partition kegs {
		partition-type = 0xC
		image = "kegs.vfat"
	}
}
