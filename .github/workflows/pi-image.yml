# Builds the Raspberry Pi 4 SD card image (Buildroot, boots straight into
# KEGS).  Runs when you push a tag like pi-v1, and publishes the image as
# a GitHub Release:   git tag pi-v1 && git push origin pi-v1
name: Pi 4 SD image

on:
  workflow_dispatch:
  push:
    tags: [ 'pi-v*' ]

env:
  BUILDROOT_VERSION: 2026.02.3

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Install build tools
        run: |
          # The runner already has nearly all of these.  Only go to the
          # Ubuntu mirrors if something is really missing, and retry, so a
          # mirror outage doesn't fail the build.
          missing=""
          for t in gcc g++ make bc bison flex cpio rsync unzip file wget \
                   python3 git perl patch; do
            command -v "$t" >/dev/null || missing="$missing $t"
          done
          [ -f /usr/include/openssl/ssl.h ] || missing="$missing libssl-dev"
          echo "missing:${missing:- none}"
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=5 update || true
            sudo apt-get -o Acquire::Retries=5 install -y build-essential \
              bc bison flex cpio rsync unzip file wget libssl-dev python3 git
          fi

      - name: Get Buildroot
        run: |
          git clone --depth 1 -b "$BUILDROOT_VERSION" \
            https://github.com/buildroot/buildroot.git ../br

      - name: Cache downloads and compiler cache
        uses: actions/cache@v4
        with:
          path: |
            ~/br-dl
            ~/.buildroot-ccache
          key: br-${{ env.BUILDROOT_VERSION }}-${{ hashFiles('buildroot/configs/*') }}-${{ github.run_id }}
          restore-keys: |
            br-${{ env.BUILDROOT_VERSION }}-${{ hashFiles('buildroot/configs/*') }}-
            br-${{ env.BUILDROOT_VERSION }}-

      - name: Configure
        run: |
          make -C ../br O="$PWD/../out" BR2_EXTERNAL="$PWD/buildroot" \
            BR2_DL_DIR="$HOME/br-dl" kegs_rpi4_defconfig

      - name: Build
        run: |
          make -C ../out BR2_DL_DIR="$HOME/br-dl" 2>&1 | tee ../build.log \
            | grep --line-buffered '^>>>'
          test "${PIPESTATUS[0]}" -eq 0

      - name: Show build log tail on failure
        if: failure()
        run: tail -200 ../build.log

      - name: Compress image
        run: |
          mkdir dist
          xz -T0 -9 -c ../out/images/sdcard.img > dist/kegs-pi4-sdcard.img.xz
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: kegs-pi4-sdcard
          path: dist/kegs-pi4-sdcard.img.xz

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/pi-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/kegs-pi4-sdcard.img.xz \
            --title "KEGS for Raspberry Pi 4 ($GITHUB_REF_NAME)" \
            --notes "SD card image that boots straight into KEGS. See buildroot/README.md."
